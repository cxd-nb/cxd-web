    <div class="page-header">

        <p>用汗水书写青春，用热爱拥抱生活。</p>
    </div>

    <section class="skills" style="padding-top:20px;">
        <div class="container">
            <div class="skills-grid">
                 <!-- 骑行 -->
                <div class="skill-card-lg">
                    <div class="skill-preview">
                        <img src="assets\sports\ride.jpg" alt="骑行作品截图"> 
                    </div>
                    <div class="skill-info">
                        <div class="skill-head">
                            <div class="icon"><i class="fas fa-bicycle"></i></div>
                            <h4>骑行</h4>
                        </div>
                        <p>用脚步丈量城市，用车轮追逐自由，享受风过耳畔的畅快</p>
                    </div>
                </div>
                 <!-- 跑步 -->
                <div class="skill-card-lg">
                    <div class="skill-preview">
                        <img src="assets\sports\run.jpg" alt="跑步作品截图"> 
                    </div>
                    <div class="skill-info">
                        <div class="skill-head">
                            <div class="icon"><i class="fas fa-running"></i></div>
                            <h4>跑步</h4>
                        </div>
                        <p>在跑道上挥洒汗水，感受每一次呼吸带来的力量</p>
                    </div>
                </div>
                 <!-- 跆拳道 -->
                <div class="skill-card-lg">
                    <div class="skill-preview">
                        <img src="assets\sports\kick.jpg" alt="跆拳道作品截图"> 
                    </div>
                    <div class="skill-info">
                        <div class="skill-head">
                            <div class="icon"><i class="fas fa-fist-raised"></i></div>
                            <h4>跆拳道</h4>
                        </div>
                        <p>在踢腿与品势中磨炼意志，保持黑带般的专注与坚韧</p>
                    </div>
                </div>
                
                 <!-- 羽毛球 -->
                <div class="skill-card-lg">
                    <div class="skill-preview">
                        <img src="assets\sports\badminton.jpg" alt="羽毛球作品截图"> 
                    </div>
                    <div class="skill-info">
                        <div class="skill-head">
                            <div class="icon"><i class="fas fa-table-tennis"></i></div>
                            <h4>羽毛球</h4>
                        </div>
                        <p>在挥拍间锻炼反应，结交更多同频好友</p>
                    </div>
                </div>
               
               
            </div>
        </div>
